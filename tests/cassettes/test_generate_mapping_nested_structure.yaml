    body: '{"messages": [{"role": "system", "content": "You are a helpful assistant
      that creates mappings between dataset fields and DataPoint fields."}, {"role":
      "user", "content": "\nGiven the following data sample:\n```json\n{\n  \"data\":
      {\n    \"input_text\": \"What is the capital of France?\",\n    \"output\":
      \"Paris is the capital of France.\",\n    \"evaluation\": {\n      \"is_correct\":
      1,\n      \"reviewer_notes\": \"Good answer, accurate and concise.\"\n    }\n  }\n}\n```\n\nCreate
      a mapping between DataPoint fields and the sample data keys. You must:\n1. Map
      \"input_data\" to the key containing the input/question/prompt\n2. Map \"output_data\"
      to the key containing the response/answer/output\n3. Map \"annotation\" to the
      key containing binary values (0/1 or True/False)\n4. Map \"note\" to the key
      containing feedback or evaluation notes\n"}], "model": "gpt-4", "tool_choice":
      {"type": "function", "function": {"name": "DatasetMapping"}}, "tools": [{"type":
      "function", "function": {"name": "DatasetMapping", "description": "Correctly
      extracted `DatasetMapping` with all the required parameters with correct types",
      "parameters": {"properties": {"input_data": {"description": "The key in the
      sample data that corresponds to the input_data field in the DataPoint object",
      "title": "Input Data", "type": "string"}, "output_data": {"description": "The
      key in the sample data that corresponds to the output_data field in the DataPoint
      object", "title": "Output Data", "type": "string"}, "annotation": {"description":
      "The key in the sample data that corresponds to the annotation field in the
      DataPoint object", "title": "Annotation", "type": "string"}, "note": {"description":
      "The key in the sample data that corresponds to the note field in the DataPoint
      object", "title": "Note", "type": "string"}}, "required": ["annotation", "input_data",
      "note", "output_data"], "type": "object"}}}]}'
