      include a range of operations like addition, subtraction, multiplication, division,
      and functions such as calculating square roots, and may use parentheses to denote
      operation precedence. The task checks whether the provided numerical output
      matches the expected result accurately.\n\nOutputs are strictly integers that
      indicate correct solutions to the expressions. The evaluation method is binary:
      the result is marked ''Correct'' if it matches the expected answer, accompanied
      by an explanatory note like ''Correct summation'' or ''Correct square root''.
      Conversely, if the result is incorrect, it is labeled as ''Incorrect'', and
      an explanation is provided to describe the mathematical error, improving understanding
      for future attempts. This helps ensure precision and learning from mistakes,
      enhancing the understanding of basic mathematical computations and their accuracy.\n\nExample
      1:\nInput:\n{\n  \"text\": \"1+1=\"\n}\n\nOutput:\n{\n  \"text\": \"2\"\n}\n\nAnnotation:
      Correct\nNote: Correct summation\n\n--------------------------------------------------\n\nExample
      2:\nInput:\n{\n  \"text\": \"1+1=\"\n}\n\nOutput:\n{\n  \"text\": \"3\"\n}\n\nAnnotation:
      Incorrect\nNote: Incorrect summation\n\n--------------------------------------------------\n\nExample
      3:\nInput:\n{\n  \"text\": \"2+2=\"\n}\n\nOutput:\n{\n  \"text\": \"4\"\n}\n\nAnnotation:
      Correct\nNote: Correct summation\n\n--------------------------------------------------\n\nExample
      4:\nInput:\n{\n  \"text\": \"(4+2)*3=\"\n}\n\nOutput:\n{\n  \"text\": \"18\"\n}\n\nAnnotation:
      Correct\nNote: Correct summation\n\n--------------------------------------------------\n\nExample
      5:\nInput:\n{\n  \"text\": \"What is the square root of 16?\"\n}\n\nOutput:\n{\n  \"text\":
      \"4\"\n}\n\nAnnotation: Correct\nNote: Correct square root\n\n--------------------------------------------------\n\n\nNote
      we have already generated criteria, so we can use that as context:\n[]\n\nGenerate
      1 evaluation criteria that can be used to assess the quality of outputs for
      this task. Consider the following guidelines:\n\n1. If a ''Metrics Details''
      field is present in the datapoint, prioritize this information as it provides
      the most important evaluation criteria.\n2. Focus on general aspects of quality
      that can be used across multiple outputs.\n3. Consider criteria that address
      potential misalignment between LLM outputs and human preferences.\n4. Include
      criteria that can be evaluated both by code and by LLM-based evaluators.\n5.
      Think about criteria that might reveal hallucinations, instruction-following,
      or other common LLM issues.\n6. Generate criteria that could help in debugging
      or improving the LLM pipeline.\n\nProvide the criterion as a concise statement,
      followed by a brief explanation of why it''s important and how it might be evaluated
      (e.g., via code, LLM evaluator, or human judgment).\n\nReturn the criteria in
      this format:\n[Criterion]: [Brief explanation and evaluation method]\n\nAim
      for a mix of straightforward, code-evaluable criteria and more nuanced criteria
      that might require LLM or human evaluation.\n"}], "model": "gpt-4o", "tool_choice":
