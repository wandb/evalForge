- request:
    body: '{"messages": [{"role": "system", "content": "\nYou are an AI assistant
      designed to create testable assertions for a given task and criterion.\n"},
      {"role": "user", "content": "\nGiven the following evaluation criterion and
      annotated data, generate 1-3 specific, testable assertions:\n\nCriterion: {''criterion'':
      ''Arithmetic Accuracy'', ''explanation'': ''Evaluates the correctness of arithmetic
      calculations, ensuring outputs are free from basic computational errors. Critical
      for maintaining the integrity of numerical tasks, this can be assessed programmatically
      by comparing the output with expected results derived from accurate calculations.'',
      ''evaluation_method'': ''code''}\n\nAnnotated data: Task Description: This task
      involves solving arithmetic and basic mathematical problems provided in text
      format, returning the numeric result as a string. The input comprises text strings
      with arithmetic expressions or math questions, like ''(4+2)*3='' or ''What is
      the square root of 16?''. The task requires parsing these expressions/questions
      and performing accurate calculations or deriving basic math solutions. The output
      must be the correct numerical answer, formatted as a string, such as ''18''
      for the expression ''(4+2)*3=''. Responses are assessed for accuracy, with each
      answer annotated as ''Correct'' or ''Incorrect''. Attention is given to ensuring
      precise calculations for all arithmetic operations and mathematical concepts
      presented in the input.\n\nExample 1:\nInput:\n{\n  \"text\": \"1+1=\"\n}\n\nOutput:\n{\n  \"text\":
      \"2\"\n}\n\nAnnotation: Correct\nNote: Correct summation\n\n--------------------------------------------------\n\nExample
      2:\nInput:\n{\n  \"text\": \"1+1=\"\n}\n\nOutput:\n{\n  \"text\": \"3\"\n}\n\nAnnotation:
      Incorrect\nNote: Incorrect summation\n\n--------------------------------------------------\n\nExample
      3:\nInput:\n{\n  \"text\": \"2+2=\"\n}\n\nOutput:\n{\n  \"text\": \"4\"\n}\n\nAnnotation:
      Correct\nNote: Correct summation\n\n--------------------------------------------------\n\nExample
      4:\nInput:\n{\n  \"text\": \"(4+2)*3=\"\n}\n\nOutput:\n{\n  \"text\": \"18\"\n}\n\nAnnotation:
      Correct\nNote: Correct summation\n\n--------------------------------------------------\n\nExample
      5:\nInput:\n{\n  \"text\": \"What is the square root of 16?\"\n}\n\nOutput:\n{\n  \"text\":
      \"4\"\n}\n\nAnnotation: Correct\nNote: Correct square root\n\n--------------------------------------------------\n\n\nYour
      task is to create assertions that can be used to evaluate LLM outputs based
      on this criterion. Follow these guidelines:\n\n1. Make each assertion clear,
      concise, and directly related to the criterion\n2. For Python assertions:\n-
      Provide a valid Python method that can be used within a unittest.TestCase class\n-
      Ensure the method name is in snake case and starts with test_\n- The method
      should take ''self'' as the only input, where ''self.output'' is a dictionary
      containing the LLM output being evaluated\n- The ''self.output'' dictionary
      will have the same keys and shape as the output in the annotated data\n- Use
      unittest assertion methods (e.g., self.assertTrue, self.assertEqual) to test
      the output\n- The test should pass if the assertion is met, and fail otherwise\n-
      Only use the keys and shapes present in the annotated data output for your assertions\n3.
      For LLM assertions:\n- Provide a clear, detailed prompt for an LLM to evaluate
      the assertion\n- The prompt should guide the LLM to return \"PASS\" or \"FAIL\"
      based on the evaluation\n4. Include a mix of positive and negative assertions
      where appropriate\n5. Consider edge cases and potential failure modes for the
      criterion\n6. Aim for assertions that could be applied across multiple types
      of outputs\n\nEnsure that your assertions are directly evaluable and avoid vague
      or subjective language. Focus on creating assertions that align with human preferences
      and can be used to validate the quality of LLM-generated evaluations.\n"}],
      "model": "gpt-4o", "tool_choice": {"type": "function", "function": {"name":
      "CriterionAssertions"}}, "tools": [{"type": "function", "function": {"name":
      "CriterionAssertions", "description": "Correctly extracted `CriterionAssertions`
      with all the required parameters with correct types", "parameters": {"$defs":
      {"LLMAssertion": {"properties": {"test_name": {"description": "A clear, concise
      name for the LLM evaluator in snake case.", "title": "Test Name", "type": "string"},
      "text": {"description": "A detailed prompt for the LLM to evaluate the assertion,
      guiding it to return ''PASS'' or ''FAIL''", "title": "Text", "type": "string"},
      "evaluation_type": {"const": "llm", "default": "llm", "enum": ["llm"], "title":
      "Evaluation Type", "type": "string"}}, "required": ["test_name", "text"], "title":
      "LLMAssertion", "type": "object"}, "PythonAssertion": {"properties": {"test_name":
      {"description": "A clear, concise name for the unittest.TestCase method with
      function name in snake case and starting with test_. Must be identical to the
      function name in the code field.", "title": "Test Name", "type": "string"},
      "code": {"description": "A clear, concise assertion written as a unittest.TestCase
      method with function name in snake case and starting with test_. Also ensure
      that the input to the function is only self and the function accesses self.output.",
      "title": "Code", "type": "string"}, "evaluation_type": {"const": "python", "default":
      "python", "enum": ["python"], "title": "Evaluation Type", "type": "string"}},
      "required": ["test_name", "code"], "title": "PythonAssertion", "type": "object"}},
      "properties": {"assertions": {"description": "Generate 1-3 specific, testable
      assertions that can be used to evaluate LLM outputs based on the given criterion",
      "items": {"anyOf": [{"$ref": "#/$defs/PythonAssertion"}, {"$ref": "#/$defs/LLMAssertion"}]},
      "maxItems": 3, "minItems": 1, "title": "Assertions", "type": "array"}}, "required":
      ["assertions"], "type": "object"}}}]}'
