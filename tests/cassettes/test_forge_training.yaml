- request:
    body: '{"messages": [{"role": "system", "content": "\nYou are an AI assistant
      designed to create evaluation criteria for a given task.\n"}, {"role": "user",
      "content": "\nAnalyze the following annotated datapoints:\n\nTask Description:
      This task involves solving arithmetic and basic mathematical problems provided
      in text format, returning the numeric result as a string. The input comprises
      text strings with arithmetic expressions or math questions, like ''(4+2)*3=''
      or ''What is the square root of 16?''. The task requires parsing these expressions/questions
      and performing accurate calculations or deriving basic math solutions. The output
      must be the correct numerical answer, formatted as a string, such as ''18''
      for the expression ''(4+2)*3=''. Responses are assessed for accuracy, with each
      answer annotated as ''Correct'' or ''Incorrect''. Attention is given to ensuring
      precise calculations for all arithmetic operations and mathematical concepts
      presented in the input.\n\nExample 1:\nInput:\n{\n  \"text\": \"1+1=\"\n}\n\nOutput:\n{\n  \"text\":
      \"2\"\n}\n\nAnnotation: Correct\nNote: Correct summation\n\n--------------------------------------------------\n\nExample
      2:\nInput:\n{\n  \"text\": \"1+1=\"\n}\n\nOutput:\n{\n  \"text\": \"3\"\n}\n\nAnnotation:
      Incorrect\nNote: Incorrect summation\n\n--------------------------------------------------\n\nExample
      3:\nInput:\n{\n  \"text\": \"2+2=\"\n}\n\nOutput:\n{\n  \"text\": \"4\"\n}\n\nAnnotation:
      Correct\nNote: Correct summation\n\n--------------------------------------------------\n\nExample
      4:\nInput:\n{\n  \"text\": \"(4+2)*3=\"\n}\n\nOutput:\n{\n  \"text\": \"18\"\n}\n\nAnnotation:
      Correct\nNote: Correct summation\n\n--------------------------------------------------\n\nExample
      5:\nInput:\n{\n  \"text\": \"What is the square root of 16?\"\n}\n\nOutput:\n{\n  \"text\":
      \"4\"\n}\n\nAnnotation: Correct\nNote: Correct square root\n\n--------------------------------------------------\n\n\nNote
      we have already generated criteria, so we can use that as context:\n[]\n\nGenerate
      1 evaluation criteria that can be used to assess the quality of outputs for
      this task. Consider the following guidelines:\n\n1. If a ''Metrics Details''
      field is present in the datapoint, prioritize this information as it provides
      the most important evaluation criteria.\n2. Focus on general aspects of quality
      that can be used across multiple outputs.\n3. Consider criteria that address
      potential misalignment between LLM outputs and human preferences.\n4. Include
      criteria that can be evaluated both by code and by LLM-based evaluators.\n5.
      Think about criteria that might reveal hallucinations, instruction-following,
      or other common LLM issues.\n6. Generate criteria that could help in debugging
      or improving the LLM pipeline.\n\nProvide the criterion as a concise statement,
      followed by a brief explanation of why it''s important and how it might be evaluated
      (e.g., via code, LLM evaluator, or human judgment).\n\nReturn the criteria in
      this format:\n[Criterion]: [Brief explanation and evaluation method]\n\nAim
      for a mix of straightforward, code-evaluable criteria and more nuanced criteria
      that might require LLM or human evaluation.\n"}], "model": "gpt-4o", "tool_choice":
      {"type": "function", "function": {"name": "EvaluationCriteria"}}, "tools": [{"type":
      "function", "function": {"name": "EvaluationCriteria", "description": "Correctly
      extracted `EvaluationCriteria` with all the required parameters with correct
      types", "parameters": {"$defs": {"Criterion": {"properties": {"criterion": {"description":
      "A concise, specific statement describing a single aspect of evaluation", "title":
      "Criterion", "type": "string"}, "explanation": {"default": "", "description":
      "A detailed explanation of the criterion''s importance and potential evaluation
      methods", "title": "Explanation", "type": "string"}, "evaluation_method": {"default":
      "", "description": "The primary method for evaluating this criterion: ''code''
      for programmatic checks, ''llm'' for language model-based assessment", "enum":
      ["code", "llm"], "title": "Evaluation Method", "type": "string"}}, "required":
      ["criterion"], "title": "Criterion", "type": "object"}}, "properties": {"criteria":
      {"description": "A list of 1-2 distinct evaluation criteria, each focusing on
      a different aspect of output quality", "items": {"$ref": "#/$defs/Criterion"},
      "maxItems": 2, "minItems": 1, "title": "Criteria", "type": "array"}}, "required":
      ["criteria"], "type": "object"}}}]}'
